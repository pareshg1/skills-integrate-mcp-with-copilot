<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <div class="section-heading">
          <div>
            <p class="eyebrow">STUDENT LIFE</p>
            <h3>Available Activities</h3>
          </div>
          <p id="activity-count" class="activity-count">Loading activities</p>
        </div>
        <div id="message" class="notice hidden" role="status" aria-live="polite"></div>
        <div id="activities-list" class="activities-grid">
          <p>Loading activities...</p>
        </div>
      </section>
    </main>

    <dialog id="signup-dialog" aria-labelledby="signup-title">
      <form id="signup-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">ACTIVITY REGISTRATION</p>
            <h2 id="signup-title">Register a student</h2>
            <p id="signup-activity" class="signup-activity"></p>
          </div>
          <button id="close-signup" class="dialog-close" type="button" aria-label="Close registration">&times;</button>
        </div>
        <div class="form-group">
          <label for="email">Student email</label>
          <input type="email" id="email" required autocomplete="email" placeholder="your-email@mergington.edu" />
        </div>
        <div id="signup-error" class="form-error hidden" role="alert"></div>
        <button class="register-submit" type="submit">Register student</button>
      </form>
    </dialog>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
